<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #ffffff; --fg: #1f2328; --muted: #6e7781; --border: #d0d7de;
      --accent: #0969da; --panel: #f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d;
        --accent: #4493f8; --panel: #161b22; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    button, select, input { font: inherit; }
    select, input { padding: 2px 6px; }
    button { cursor: pointer; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--panel); color: var(--fg); }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { color: #fff; background: #cf222e; border-color: #a40e26; }
    a { color: var(--accent); }
    code { font: 12px ui-monospace, monospace; background: var(--panel); padding: 0 3px; }
    /* Главные вкладки */
    nav { display: flex; gap: 2px; padding: 6px 12px 0; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; align-items: flex-end; }
    nav .brand { font-weight: 700; margin-right: 12px; padding-bottom: 6px; }
    nav button { border: 1px solid transparent; border-bottom: none; background: none;
      border-radius: 6px 6px 0 0; padding: 5px 12px; color: var(--muted); }
    nav button.active { color: var(--fg); border-color: var(--border); background: var(--bg);
      margin-bottom: -1px; }
    nav .sep { width: 1px; background: var(--border); align-self: stretch; margin: 4px 6px 6px; }
    nav .running-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: #1a7f37; margin-left: 5px; vertical-align: middle; }
    main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .page { display: none; flex: 1; min-height: 0; overflow: auto; padding: 8px 16px; }
    .page.active { display: block; }
    #workspace.active { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
    /* Панель графика */
    .toolbar { display: flex; gap: 8px 14px; align-items: center; padding: 6px 16px;
      flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .toolbar .group { display: flex; gap: 6px; align-items: center; }
    #w-status { color: var(--muted); margin-left: auto; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); padding: 4px 16px 0;
      font-size: 12px; }
    .legend span::before { content: ""; display: inline-block; width: 12px; height: 3px;
      margin-right: 4px; vertical-align: middle; background: var(--c); }
    #tradeinfo { padding: 2px 16px; color: var(--muted); min-height: 1.3em; font-size: 13px; }
    #tradeinfo b { color: var(--fg); font-weight: 600; }
    #charts { flex: 1; min-height: 240px; display: flex; flex-direction: column; overflow: hidden; }
    #chart { flex: 3 1 0; min-height: 140px; }
    .pane { flex: 1 1 0; min-height: 44px; max-height: 120px; border-top: 1px solid var(--border);
      position: relative; }
    .pane .pane-title { position: absolute; left: 8px; top: 2px; z-index: 3; font-size: 11px;
      color: var(--muted); pointer-events: none; }
    #nodata { padding: 6px 16px; display: none; }
    /* Нижняя панель */
    #panel { height: 38vh; min-height: 200px; display: flex; flex-direction: column;
      border-top: 1px solid var(--border); }
    .subtabs { display: flex; gap: 4px; padding: 4px 16px 0; flex-wrap: wrap; }
    .subtabs button { background: none; border: 1px solid transparent; border-bottom: none;
      border-radius: 6px 6px 0 0; color: var(--muted); padding: 3px 10px; }
    .subtabs button.active { color: var(--fg); border-color: var(--border); }
    .sub { flex: 1; overflow: auto; padding: 6px 16px; display: none; }
    .sub.active { display: block; }
    #sub-equity.active { display: flex; }
    #equity { flex: 1; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 2px 8px; border-bottom: 1px solid var(--border);
      white-space: nowrap; }
    td.num, th.num { text-align: right; }
    th { position: sticky; top: 0; background: var(--bg); color: var(--muted); font-weight: 500; }
    tr.click { cursor: pointer; }
    tr.click:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
    tr.selected { background: color-mix(in srgb, #4a90e2 18%, transparent); }
    .win { color: #1a7f37; } .loss { color: #cf222e; } .warn { color: #9a6700; }
    .hint { color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 6px 0; }
    .row label { display: inline-flex; gap: 4px; align-items: center; }
    .params input { width: 7em; }
    .log { white-space: pre-wrap; font: 12px ui-monospace, monospace; background: var(--panel);
      border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; max-height: 260px;
      overflow: auto; margin: 6px 0; }
    .log:empty { display: none; }
    pre.report { white-space: pre-wrap; font: 13px ui-monospace, monospace; margin: 0; }
    h3 { margin: 12px 0 6px; font-size: 15px; }
    h4 { margin: 10px 0 4px; font-size: 14px; }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin: 8px 0;
      background: var(--panel); }
    .badge { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px;
      border: 1px solid var(--border); }
    .badge.running { color: #1a7f37; border-color: #1a7f37; }
    .badge.error { color: #cf222e; border-color: #cf222e; }
    .badge.starting { color: #9a6700; border-color: #9a6700; }
    .lvl-warning { color: #9a6700; } .lvl-error { color: #cf222e; }
    .cols { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 16px; }
    .cmdlist button { display: block; width: 100%; text-align: left; margin: 2px 0;
      background: none; border-color: transparent; }
    .cmdlist button.active { border-color: var(--border); background: var(--panel); }
    .cmdlist .group { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
    .post { border-bottom: 1px solid var(--border); padding: 6px 0; }
    .post .meta { color: var(--muted); font-size: 12px; }
    .post .text { white-space: pre-wrap; margin: 4px 0; }
    .bias { font-weight: 600; margin-right: 8px; }
    .post .imgs img { max-height: 160px; max-width: 260px; margin: 4px 6px 0 0;
      border: 1px solid var(--border); border-radius: 4px; }
    .side-LONG { color: #1a7f37; font-weight: 600; } .side-SHORT { color: #cf222e; font-weight: 600; }
    textarea { font: 12px ui-monospace, monospace; width: 100%; box-sizing: border-box;
      background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; }
    .bias.BULLISH { color: #1a7f37; } .bias.BEARISH { color: #cf222e; }
    .jrow td:last-child { white-space: normal; word-break: break-all;
      font: 12px ui-monospace, monospace; }
    /* Страница «Старт» */
    .steps { max-width: 980px; }
    .step { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 10px 0;
      background: var(--panel); overflow-x: auto; }
    .step h3 { margin: 0 0 6px; }
    .step .stepnum { display: inline-block; width: 22px; height: 22px; border-radius: 50%; text-align: center;
      line-height: 22px; background: var(--accent); color: #fff; font-size: 13px; margin-right: 6px; }
    .step.done .stepnum { background: #1a7f37; }
    .step.todo .stepnum { background: #9a6700; }
    .flow { color: var(--muted); margin: 4px 0 8px; }
    footer { padding: 3px 16px; color: var(--muted); font-size: 12px;
      border-top: 1px solid var(--border); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <nav id="nav"><span class="brand">Bot</span></nav>
  <main>
    <!-- Рабочая область графика: «Обзор» и вкладки стратегий -->
    <section id="workspace" class="page">
      <div class="toolbar">
        <div class="group"><label>Символ <select id="w-symbol"></select></label>
          <label>Таймфрейм <select id="w-tf"></select></label></div>
        <div class="group" title="Показать график за свой период (даты в UTC)">
          Период с <input id="w-from" type="date"> по <input id="w-to" type="date">
          <button id="w-show">Показать</button>
          <button id="w-live" title="Вернуться к живому графику (последние свечи)">Сейчас</button>
        </div>
        <button id="w-refresh" title="Догрузить свежие свечи с Bybit и перерисовать">Обновить</button>
        <span id="w-status"></span>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hint" id="cells-note" style="padding: 0 16px; font-size: 12px"></div>
      <div id="tradeinfo"></div>
      <div id="nodata" class="hint"></div>
      <div id="charts"><div id="chart"></div></div>
      <div id="panel">
        <div class="subtabs" id="subtabs"></div>
        <div id="sub-backtest" class="sub"></div>
        <div id="sub-trades" class="sub"></div>
        <div id="sub-equity" class="sub"><div id="equity"></div></div>
        <div id="sub-report" class="sub"></div>
        <div id="sub-bots" class="sub"></div>
        <div id="sub-about" class="sub"></div>
      </div>
    </section>

    <section id="page-home" class="page"></section>
    <section id="page-bots" class="page"></section>
    <section id="page-data" class="page"></section>
    <section id="page-journals" class="page"></section>
    <section id="page-commands" class="page"></section>
    <section id="page-scenarios" class="page"></section>
  </main>
  <footer>
    Время на графике — локальное, даты периодов — UTC. Графики:
    <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>
    Lightweight Charts™ (Apache 2.0).
  </footer>

  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script>
  "use strict";
  // ===================== общие помощники =====================
  const $ = (id) => document.getElementById(id);
  const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (v, d = 4) => v === null || v === undefined ? "—"
    : Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
  const num = (x, d = 2) => (x === null || x === undefined ? "—" : Number(x).toFixed(d));
  const when = (t) => t === null || t === undefined ? "—" : new Date(t * 1000).toLocaleString();
  const isoTime = (s) => s ? String(s).slice(0, 19).replace("T", " ") : "—";
  // Сервер отдаёт время в UTC; на графике сдвигаем на часовой пояс компьютера.
  const local = (t) => t - new Date(t * 1000).getTimezoneOffset() * 60;
  const utcDay = (text) => text ? Date.parse(text + "T00:00:00Z") / 1000 : null;
  const TF_SECONDS = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "4h": 14400, "1d": 86400 };

  async function api(path, options = {}) {
    const opts = { ...options };
    if (opts.body !== undefined && typeof opts.body !== "string") {
      opts.body = JSON.stringify(opts.body);
      opts.headers = { "Content-Type": "application/json" };
    }
    const response = await fetch(path, opts);
    let data = null;
    try { data = await response.json(); } catch (e) { data = null; }
    if (!response.ok) {
      const detail = data && data.detail;
      let message = `ошибка ${response.status}`;
      if (typeof detail === "string") message = detail;
      else if (Array.isArray(detail)) {
        message = detail.map((d) => `${(d.loc || []).slice(1).join(".")}: ${d.msg}`).join("; ");
      } else if (detail && detail.message) message = detail.message;
      const error = new Error(message);
      error.status = response.status;
      error.detail = detail;
      throw error;
    }
    return data;
  }

  // Следить за фоновой задачей: onLog получает последние строки журнала задачи.
  async function watchJob(jobId, onLog) {
    for (;;) {
      const job = await api(`/api/jobs/${jobId}?log=300`);
      onLog(job);
      if (job.status !== "running") return job;
      await new Promise((r) => setTimeout(r, 1000));
    }
  }
  const jobText = (job) => (job.log || []).join("\n");

  function parseValue(text) {
    const t = String(text).trim();
    if (t === "true" || t === "false") return t === "true";
    if (t === "null" || t === "") return null;
    const n = Number(t);
    return Number.isNaN(n) ? t : n;
  }

  function chartOptions(extra = {}) {
    return {
      autoSize: true,
      layout: { background: { color: dark ? "#0d1117" : "#ffffff" },
                textColor: dark ? "#e6edf3" : "#1f2328", attributionLogo: true },
      grid: { vertLines: { color: dark ? "#21262d" : "#eef1f4" },
              horzLines: { color: dark ? "#21262d" : "#eef1f4" } },
      timeScale: { timeVisible: true, secondsVisible: false },
      rightPriceScale: { minimumWidth: 90 },
      ...extra,
    };
  }

  // ===================== данные приложения =====================
  const app = {
    symbols: [], timeframes: [], strategies: [], backtests: [], bots: [],
    tab: "home",            // текущая главная вкладка
    views: {},              // состояние каждой вкладки графика
  };
  const STRATEGY_TITLES = { random_entry: "Random (база)", telegram_scenario: "Сценарии TG" };
  const TG = "telegram_scenario";  // единственная торговая стратегия

  function view(key) {
    if (!app.views[key]) {
      const strategy = key === "overview" ? null : app.strategies.find((s) => s.name === key);
      app.views[key] = {
        key, strategy: strategy ? strategy.name : null,
        params: strategy ? { ...strategy.params } : {},
        symbol: app.symbols[0], tf: "1h", range: null,
        source: null,      // {type: "backtest"|"bot", id, trades}
        trade: null,       // номер выбранной сделки
        sub: key === "overview" ? "backtests" : "backtest",
        jobLog: "",
      };
    }
    return app.views[key];
  }

  // ===================== главные вкладки =====================
  function renderNav() {
    // Порядок вкладок — порядок работы: посты → ячейки → график/бэктест → боты
    const items = [["home", "Старт"], ["scenarios", "Сценарии"], [TG, "График и бэктест"], ["bots", "Боты"]];
    const rest = [["data", "Данные"], ["journals", "Журналы"], ["commands", "Команды"]];
    const running = app.bots.some((b) => b.state === "running");
    const btn = ([key, title]) => `<button data-tab="${key}" class="${app.tab === key ? "active" : ""}">` +
      `${esc(title)}${key === "bots" && running ? '<span class="running-dot" title="работает paper-бот"></span>' : ""}</button>`;
    $("nav").innerHTML = `<span class="brand">Bot</span>` + items.map(btn).join("") +
      `<span class="sep"></span>` + rest.map(btn).join("");
    $("nav").querySelectorAll("button").forEach((b) => b.onclick = () => openTab(b.dataset.tab));
  }

  function openTab(key) {
    app.tab = key;
    try { localStorage.setItem("bot.tab", key); } catch (e) { /* без localStorage */ }
    renderNav();
    const isChart = key === "overview" || app.strategies.some((s) => s.name === key);
    document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
    if (isChart) {
      $("workspace").classList.add("active");
      showView(view(key));
    } else {
      $("page-" + key).classList.add("active");
      ({ home: renderHome, bots: renderBotsPage, data: renderDataPage, journals: renderJournalsPage,
         commands: renderCommandsPage, scenarios: renderScenarios })[key]();
    }
  }

  // ===================== графики =====================
  const chart = LightweightCharts.createChart($("chart"), chartOptions());
  const candles = chart.addCandlestickSeries();
  let overlays = [];        // линии поверх свечей
  let panes = [];           // {chart, el, series: []}
  let priceLines = [];
  let syncing = false;
  chart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
    if (syncing || !range) return;
    syncing = true;
    panes.forEach((p) => p.chart.timeScale().setVisibleLogicalRange(range));
    syncing = false;
  });

  function clearIndicators() {
    overlays.forEach((s) => chart.removeSeries(s));
    overlays = [];
    panes.forEach((p) => { p.chart.remove(); p.el.remove(); });
    panes = [];
  }

  function lineSeries(target, s) {
    if (s.kind === "histogram") {
      return target.addHistogramSeries({ color: s.color + "88", priceLineVisible: false,
                                         lastValueVisible: false });
    }
    return target.addLineSeries({ color: s.color, lineWidth: s.pane === "price" ? 2 : 1.5,
      lineStyle: s.dashed ? 2 : 0, priceLineVisible: false, lastValueVisible: s.pane !== "price" });
  }

  function seriesData(rows, values) {
    // Пустые точки (whitespace) сохраняют выравнивание панелей по свечам
    return rows.map((r, i) => values[i] === null || values[i] === undefined
      ? { time: local(r.time) } : { time: local(r.time), value: values[i] });
  }

  const OVERVIEW_SERIES = [
    { column: "ema20", label: "EMA20", color: "#f5a623", pane: "price" },
    { column: "ema50", label: "EMA50", color: "#4a90e2", pane: "price" },
    { column: "ema200", label: "EMA200", color: "#bd10e0", pane: "price" },
    { column: "bb_upper", label: "Bollinger (20, 2)", color: "#8b949e", pane: "price" },
    { column: "bb_middle", label: "", color: "#8b949e", pane: "price" },
    { column: "bb_lower", label: "", color: "#8b949e", pane: "price" },
  ];

  function drawIndicators(rows, series) {
    clearIndicators();
    const legend = [];
    const byPane = {};
    for (const s of series) {
      if (s.label) legend.push(`<span style="--c:${s.color}" title="${esc(s.pane === "price" ? "на графике цены" : "панель " + s.pane)}">${esc(s.label)}</span>`);
      if (s.pane === "price") {
        const line = lineSeries(chart, s);
        line.setData(seriesData(rows, s.values));
        overlays.push(line);
      } else {
        (byPane[s.pane] = byPane[s.pane] || []).push(s);
      }
    }
    $("legend").innerHTML = legend.join("");
    for (const [name, list] of Object.entries(byPane)) {
      const el = document.createElement("div");
      el.className = "pane";
      el.innerHTML = `<div class="pane-title">${esc(name)}</div>`;
      $("charts").appendChild(el);
      const opts = chartOptions({
        timeScale: { visible: false }, handleScroll: false, handleScale: false,
        crosshair: { horzLine: { visible: true } } });
      // Логотип TradingView — на основном графике и ссылка внизу страницы
      opts.layout = { ...opts.layout, attributionLogo: false };
      const c = LightweightCharts.createChart(el, opts);
      const pane = { chart: c, el, series: [] };
      for (const s of list) {
        const line = lineSeries(c, s);
        line.setData(seriesData(rows, s.values));
        for (const level of s.levels || []) {
          line.createPriceLine({ price: level, color: "#8b949e", lineWidth: 1, lineStyle: 2,
                                 axisLabelVisible: true, title: "" });
        }
        pane.series.push(line);
      }
      panes.push(pane);
    }
    const range = chart.timeScale().getVisibleLogicalRange();
    if (range) panes.forEach((p) => p.chart.timeScale().setVisibleLogicalRange(range));
  }

  let reloadTimer = null;
  let loadSeq = 0;
  async function loadChart(v, opts = {}) {
    const seq = ++loadSeq;
    const keep = opts.keepView ? chart.timeScale().getVisibleLogicalRange() : null;
    if (!opts.keepView) $("w-status").textContent = "загрузка…";
    const q = new URLSearchParams({ symbol: v.symbol, timeframe: v.tf, limit: 1000 });
    if (opts.until) q.set("until", opts.until);
    else if (v.range) { q.set("start", v.range.start); if (v.range.end) q.set("end", v.range.end); }
    let data;
    try {
      if (v.strategy) {
        q.set("strategy", v.strategy);
        q.set("params", JSON.stringify(v.params));
        data = await api("/api/strategy-chart?" + q);
      } else {
        data = await api("/api/candles?" + q);
      }
    } catch (e) { $("w-status").textContent = "ошибка: " + e.message; return; }
    if (seq !== loadSeq) return;  // пока грузили, выбрали другое
    const rows = data.candles;
    candles.setData(rows.map((r) => ({ time: local(r.time), open: r.open, high: r.high,
                                       low: r.low, close: r.close })));
    const series = v.strategy ? data.series
      : OVERVIEW_SERIES.map((s) => ({ ...s, values: rows.map((r) => r[s.column]) }));
    drawIndicators(rows, series);
    drawTrades(v, rows);
    if (v.strategy === TG) drawCells(v);
    if (keep) chart.timeScale().setVisibleLogicalRange(keep);
    else if (!opts.until) chart.timeScale().fitContent();
    $("w-status").textContent = statusText(v, data, rows, opts.until);
    showNoData(v, rows);
    clearTimeout(reloadTimer);
    if (!opts.until && !v.range && app.views[app.tab] === v) {
      reloadTimer = setTimeout(() => { if (app.views[app.tab] === v && !v.trade) loadChart(v, { keepView: true }); },
                               data.refreshing ? 5000 : 60000);
    }
    return rows;
  }

  function statusText(v, data, rows, until) {
    if (!rows.length) return data.refreshing ? "загружаю свечи с Bybit…" : "нет свечей";
    let text = `${rows.length} свечей`;
    if (v.range && !until) text += ` за период`;
    text += `, последняя минута ${data.last_minute ? when(data.last_minute) : "—"}`;
    if (data.truncated) text += " · период обрезан до 20 000 свечей — возьмите таймфрейм крупнее";
    const lag = data.last_minute ? Math.round((Date.now() / 1000 - data.last_minute) / 60) : 0;
    if (data.refreshing) text += " · догружаю свежие свечи с Bybit…";
    else if (data.refresh_error) text += ` · ${data.refresh_error}`;
    else if (lag > 3 && !until && !v.range) text += ` · отстаёт на ${lag} мин`;
    return text;
  }

  // Маркеры входов и выходов сделок (бэктеста или paper-бота) на загруженных свечах
  function drawTrades(v, rows) {
    priceLines.forEach((l) => candles.removePriceLine(l));
    priceLines = [];
    const src = v.source;
    if (!src || src.symbol !== v.symbol || !rows.length) { candles.setMarkers([]); return; }
    const step = TF_SECONDS[v.tf];
    const first = rows[0].time, last = rows.at(-1).time + step;
    const bar = (t) => local(Math.floor(t / step) * step);
    const markers = [];
    for (const t of src.trades) {
      const long = t.side === "LONG";
      const chosen = t.number === v.trade;
      if (t.entry_time && t.entry_time >= first && t.entry_time < last) {
        markers.push({ time: bar(t.entry_time), position: long ? "belowBar" : "aboveBar",
          shape: long ? "arrowUp" : "arrowDown", color: long ? "#1a7f37" : "#cf222e",
          text: chosen ? `#${t.number} вход` : `#${t.number}` });
      }
      if (t.exit_time && t.exit_time >= first && t.exit_time < last) {
        const good = (t.net_pnl ?? 0) >= 0;
        const result = t.r_multiple !== null && t.r_multiple !== undefined
          ? `${t.r_multiple.toFixed(2)}R` : `${fmt(t.net_pnl, 2)}$`;
        markers.push({ time: bar(t.exit_time), position: long ? "aboveBar" : "belowBar",
          shape: "circle", color: good ? "#1a7f37" : "#cf222e", text: `${t.exit_reason || ""} ${result}` });
      }
    }
    markers.sort((a, b) => a.time - b.time);
    candles.setMarkers(markers);
    const t = src.trades.find((x) => x.number === v.trade);
    if (!t) return;
    const add = (price, color, title, style = 2) => {
      if (price !== null && price !== undefined) {
        priceLines.push(candles.createPriceLine({ price, color, title, lineWidth: 1,
                                                  lineStyle: style, axisLabelVisible: true }));
      }
    };
    add(t.entry_price, "#4a90e2", "вход", 0);
    add(t.initial_stop, "#cf222e", "стоп");
    if (t.stop !== t.initial_stop) add(t.stop, "#fb8f44", "стоп (трейлинг)");
    add(t.take, "#1a7f37", "тейк");
  }

  // Активные ячейки монеты — горизонтальные линии: уровень входа (или зона) и стоп автора
  let cellLines = [];
  async function drawCells(v) {
    let cells = [];
    try { cells = (await api("/api/scenarios?limit=1")).cells; } catch (e) { cells = []; }
    cellLines.forEach((l) => candles.removePriceLine(l));
    cellLines = [];
    if (app.views[app.tab] !== v) return;
    const mine = cells.filter((c) => c.status === "ACTIVE" && c.symbol === v.symbol);
    for (const c of mine) {
      const s = c.scenario, t = s.trigger;
      const color = s.side === "LONG" ? "#1a7f37" : "#cf222e";
      const tag = `${s.side} ${c.needs_review ? "(не одобрена) " : ""}`;
      const line = (price, title, style, lineColor = color) => {
        if (price === null || price === undefined) return;
        cellLines.push(candles.createPriceLine({ price, color: lineColor, title, lineWidth: 1,
                                                 lineStyle: style, axisLabelVisible: true }));
      };
      if (t.type === "touch_zone") { line(t.zone_low, tag + "зона", 0); line(t.zone_high, tag + "зона", 0); }
      else line(t.level, tag + triggerText(t), 0);
      line(s.stop, "стоп автора", 3, "#8b949e");
    }
    const note = mine.length ? `Активных ячеек ${v.symbol}: ${mine.length}. Линии: уровень входа — сплошная, стоп автора — пунктир.` : "";
    const el = $("cells-note");
    if (el) el.textContent = note;
  }

  async function showTrade(v, number) {
    v.trade = number;
    renderTradesTable(v);
    const t = v.source && v.source.trades.find((x) => x.number === number);
    if (!t) { $("tradeinfo").textContent = ""; loadChart(v); return; }
    const result = t.r_multiple !== null && t.r_multiple !== undefined
      ? `${t.r_multiple.toFixed(2)}R, ` : "";
    $("tradeinfo").innerHTML = `<b>#${t.number} ${t.side}</b> вход ${when(t.entry_time)} по ` +
      `${fmt(t.entry_price)}, стоп ${fmt(t.initial_stop)}, тейк ${fmt(t.take)}; ` +
      `выход ${when(t.exit_time)} по ${fmt(t.exit_price)} (${esc(t.exit_reason || "открыта")}), ` +
      `<b>${result}${fmt(t.net_pnl, 2)} USDT</b>` + (t.reason ? ` · ${esc(t.reason)}` : "");
    const step = TF_SECONDS[v.tf];
    const end = (t.exit_time ?? Math.floor(Date.now() / 1000));
    await loadChart(v, { until: end + 60 * step });
    chart.timeScale().setVisibleRange({ from: local(t.entry_time) - 60 * step,
                                        to: local(end) + 60 * step });
  }

  // ---------- Бэктест ----------

      `<label>${esc(k)} <input name="${esc(k)}" value="${esc(val)}"></label>`).join("") + `</div>`;
  }
  function readParams(id) {
    const out = {};

    return out;
  }

  function renderBacktestTab(v) {
    const box = $("sub-backtest");
    const list = app.backtests.filter((b) => !v.strategy || b.strategy === v.strategy);
    const rows = list.map((b) => `<tr class="click${v.source && v.source.id === b.id ? " selected" : ""}" data-id="${esc(b.id)}">` +
      `<td>${esc(b.created)}</td><td>${esc(b.strategy)}</td><td>${esc(b.symbol)}</td><td>${esc(b.timeframe)}</td></tr>`).join("");
    const table = list.length
      ? `<table><thead><tr><th>Создан (UTC)</th><th>Стратегия</th><th>Символ</th><th>ТФ</th></tr></thead><tbody>${rows}</tbody></table>`

      box.innerHTML = `
        <div class="row">
          <span>Символ и таймфрейм — как на графике: <b>${esc(v.symbol)} ${esc(v.tf)}</b></span>
          <label>С <input id="bt-from" type="date" value="${defFrom}"></label>
          <label>по <input id="bt-to" type="date" value="${defTo}"></label>
          <label title="Перед бэктестом догрузить с Bybit недостающие свечи и funding за период">
            <input id="bt-download" type="checkbox" checked> догрузить данные</label>
          <button id="bt-run" class="primary">Запустить бэктест</button>
          <button id="bt-apply" title="Перерисовать индикаторы на графике с этими параметрами">Параметры → график</button>
          <button id="bt-reset">Параметры по умолчанию</button>
        </div>
        <div class="hint">Параметры стратегии (те же, что <code>--param</code> в терминале):</div>
        ${paramsForm(v, "bt-params")}
        <p class="hint">In-sample — 2021-01-01 … 2024-06-30, validation — 2024-07-01 … 2025-06-30,
          hold-out — 2025-07-01 … 2026-09-30 (его смотрят один раз; интерфейс спросит подтверждение).</p>
        <div class="log" id="bt-log">${esc(v.jobLog || "")}</div>
        <h4>Бэктесты этой стратегии</h4>${table}`;
      $("bt-run").onclick = () => runBacktest(v, false);
      $("bt-apply").onclick = () => { v.params = readParams("bt-params"); loadChart(v, { keepView: true }); };
      $("bt-reset").onclick = () => {
        v.params = { ...app.strategies.find((s) => s.name === v.strategy).params };
        renderBacktestTab(v); loadChart(v, { keepView: true });

      $("bt-from").onchange = () => v.btFrom = $("bt-from").value;
      $("bt-to").onchange = () => v.btTo = $("bt-to").value;
    }
    box.querySelectorAll("tr.click").forEach((tr) => tr.onclick = () => chooseBacktest(v, tr.dataset.id));

  async function runBacktest(v, allowHoldout) {
    v.params = readParams("bt-params");
    const body = { strategy: v.strategy, symbol: v.symbol, timeframe: v.tf,
      start: $("bt-from").value, end: $("bt-to").value, params: v.params,
      download: $("bt-download").checked, allow_holdout: allowHoldout };
    const log = (text) => { v.jobLog = text; const el = $("bt-log"); if (el && app.views[app.tab] === v) el.textContent = text; };
    let started;
    try {
      started = await api("/api/backtests/run", { method: "POST", body });
    } catch (e) {
      if (e.status === 409 && e.detail && e.detail.holdout) {
        if (confirm(e.message + "\n\nЗапустить всё равно?")) return runBacktest(v, true);
        log("отменено: период задевает hold-out");
        return;
      }
      log("ошибка: " + e.message);
      return;
    }
    $("bt-run").disabled = true;
    const job = await watchJob(started.job_id, (j) => log(jobText(j)));
    if ($("bt-run")) $("bt-run").disabled = false;
    if (job.status === "done") {
      await refreshBacktests();
      await chooseBacktest(v, job.backtest_id);
    }
  }

  async function refreshBacktests() {
    app.backtests = (await api("/api/backtests")).backtests;
  }

  async function chooseBacktest(v, id) {
    const data = await api("/api/backtests/" + encodeURIComponent(id));
    v.source = { type: "backtest", id, symbol: data.symbol, title: id, trades: data.trades };
    v.symbol = data.symbol;
    if (TF_SECONDS[data.timeframe]) v.tf = data.timeframe;
    $("w-symbol").value = v.symbol; $("w-tf").value = v.tf;
    renderBacktestTab(v);
    renderTradesTable(v);
    loadEquity(id);
    renderReport(v);
    if (data.trades.length) { openSub(v, "trades"); showTrade(v, data.trades[0].number); }
    else { v.trade = null; $("tradeinfo").textContent = "в бэктесте нет сделок"; loadChart(v); }
  }

  // ---------- Сделки, капитал, отчёт ----------
  function renderTradesTable(v) {
    const box = $("sub-trades");
    const src = v.source;
    if (!src) { box.innerHTML = `<p class="hint">Выберите бэктест или paper-бота.</p>`; return; }
    if (!src.trades.length) { box.innerHTML = `<p class="hint">${esc(src.title)}: сделок нет.</p>`; return; }
    const rows = src.trades.map((t) => {
      const good = (t.net_pnl ?? 0) >= 0 ? "win" : "loss";
      const r = t.r_multiple !== null && t.r_multiple !== undefined ? t.r_multiple.toFixed(2) : "—";
      return `<tr class="click${t.number === v.trade ? " selected" : ""}" data-n="${t.number}"><td>${t.number}</td><td>${t.side}</td>` +
        `<td>${when(t.entry_time)}</td><td class="num">${fmt(t.entry_price)}</td>` +
        `<td>${when(t.exit_time)}</td><td class="num">${fmt(t.exit_price)}</td>` +
        `<td>${esc(t.exit_reason || t.status || "")}</td><td class="num ${good}">${r}</td>` +
        `<td class="num ${good}">${fmt(t.net_pnl, 2)}</td></tr>`;
    }).join("");
    box.innerHTML = `<div class="hint">${esc(src.type === "bot" ? "Paper-бот " : "Бэктест ")}${esc(src.title)}</div>` +
      `<table><thead><tr><th>#</th><th>Сторона</th><th>Вход</th><th class="num">Цена</th>` +
      `<th>Выход</th><th class="num">Цена</th><th>Причина</th><th class="num">R</th><th class="num">USDT</th></tr></thead>` +
      `<tbody>${rows}</tbody></table>`;
    box.querySelectorAll("tr.click").forEach((tr) => tr.onclick = () => showTrade(v, Number(tr.dataset.n)));
  }

  const equityChart = LightweightCharts.createChart($("equity"), chartOptions({
    grid: { vertLines: { visible: false }, horzLines: { color: dark ? "#21262d" : "#eef1f4" } } }));
  const equityLine = equityChart.addLineSeries({ color: "#4a90e2", lineWidth: 2 });
  async function loadEquity(id) {

    $("sub-about").innerHTML = `<h3>${esc(STRATEGY_TITLES[s.name] || s.name)} <span class="hint">v${esc(s.version)}</span></h3>` +
      `<pre class="report">${esc(s.description)}</pre>` +
      `<h4>Индикаторы на графике</h4><ul>${s.indicators.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` +
      `<p class="hint">Индикаторы считаются тем же кодом стратегии (prepare), что в бэктесте и у бота.</p>`;

  // ---------- Paper-боты стратегии ----------
  async function refreshBots() {
    try { app.bots = (await api("/api/bots")).bots; } catch (e) { app.bots = []; }
    renderNav();
  }

  function botRow(b, withStrategy) {
    const badge = `<span class="badge ${b.state}">${{ running: "работает", starting: "запускается", stopped: "остановлен", error: "ошибка" }[b.state] || b.state}</span>`;
    const pnl = b.closed_pnl >= 0 ? "win" : "loss";
    const buttons = [
      b.state === "running" || b.state === "starting"
        ? `<button data-act="stop">Стоп</button>` : `<button data-act="start">Старт</button>`,
      b.state === "running" ? (b.kill ? `<button data-act="resume">Возобновить</button>`
        : `<button data-act="kill" class="danger" title="Закрыть позиции и не открывать новых">Аварийно</button>`) : "",
      `<button data-act="show">На графике</button>`,
      withStrategy ? `<button data-act="detail">Подробно</button>` : "",
      b.state !== "running" ? `<button data-act="delete" title="Убрать из списка (сделки и журнал останутся)">Удалить</button>` : "",
    ].join(" ");
    return `<tr data-id="${esc(b.id)}"><td>${esc(b.id)}</td>${withStrategy ? `<td>${esc(b.strategy)}</td>` : ""}` +
      `<td>${esc(b.symbol)} ${esc(b.timeframe)}</td><td>${badge}${b.error ? ` <span class="loss">${esc(b.error)}</span>` : ""}` +
      `${b.kill ? ` <span class="loss">остановлен: ${esc(b.kill)}</span>` : ""}</td>` +
      `<td class="num">${num(b.equity)}</td><td class="num">${b.open_trades}</td>` +
      `<td class="num">${b.closed_trades}</td><td class="num ${pnl}">${num(b.closed_pnl)}</td><td>${buttons}</td></tr>`;

    if (!list.length) return `<p class="hint">Ботов нет.</p>`;
    return `<table><thead><tr><th>Бот</th>${withStrategy ? "<th>Стратегия</th>" : ""}<th>Символ</th><th>Состояние</th>` +
      `<th class="num">Капитал</th><th class="num">Открыто</th><th class="num">Закрыто</th><th class="num">Итог, USDT</th><th></th></tr></thead>` +
      `<tbody>${list.map((b) => botRow(b, withStrategy)).join("")}</tbody></table>`;

  function bindBotButtons(box, after) {
    box.querySelectorAll("button[data-act]").forEach((btn) => btn.onclick = async () => {
      const id = btn.closest("tr").dataset.id, act = btn.dataset.act;
      try {
        if (act === "show") return showBotTrades(id);
        if (act === "detail") return renderBotDetail(id);
        if (act === "kill" && !confirm("Закрыть виртуальные позиции бота и остановить торговлю?")) return;
        if (act === "delete" && !confirm(`Убрать бота ${id} из списка?`)) return;
        await api(`/api/bots/${encodeURIComponent(id)}${act === "delete" ? "" : "/" + act}`,
                  { method: act === "delete" ? "DELETE" : "POST" });
      } catch (e) { alert(e.message); }
      await refreshBots(); after();
    });
  }

  function botTrades(detail) {
    const rows = [...detail.status.closed].reverse().concat(detail.status.trades);
    const sec = (s) => s ? Math.floor(Date.parse(s) / 1000) : null;

  function argInput(a) {
    const id = "arg" + a.flag.replace(/[^a-z0-9]/gi, "_");
    const def = a.default ?? "";
    let input;
    if (a.kind === "flag") input = `<input type="checkbox" id="${id}">`;
    else if (a.kind === "choice") {
      input = `<select id="${id}">${a.required ? "" : `<option value="">—</option>`}` +
        a.choices.map((c) => `<option${c === def ? " selected" : ""}>${esc(c)}</option>`).join("") + `</select>`;
    } else if (a.kind === "multi") {
      input = `<span class="checks" id="${id}">` + a.choices.map((c) =>
        `<label><input type="checkbox" value="${esc(c)}"> ${esc(c)}</label>`).join("") + `</span>`;
    } else if (a.kind === "kv") {
      input = `<textarea id="${id}" rows="2" cols="30" placeholder="ключ=значение, по строке"></textarea>`;
    } else {
      const type = a.kind === "date" ? "date" : (a.kind === "int" || a.kind === "float") ? "number" : "text";
      input = `<input id="${id}" type="${type}" value="${esc(def)}"${a.kind === "float" ? ' step="any"' : ""}>`;
    }
    return `<div class="row"><label>${esc(a.label)}${a.required ? " *" : ""} ${input}</label>` +
      `<span class="hint"><code>${esc(a.flag)}</code> ${esc(a.help || "")}</span></div>`;
  }
  function readArg(a) {
    const el = $("arg" + a.flag.replace(/[^a-z0-9]/gi, "_"));
    if (a.kind === "flag") return el.checked;
    if (a.kind === "multi") return [...el.querySelectorAll("input:checked")].map((i) => i.value);
    if (a.kind === "kv") return el.value.split("\n").map((x) => x.trim()).filter(Boolean);
    return el.value;
  }

  function renderCommandForm(c) {
    $("cmd-form").innerHTML = `<h3>${esc(c.title)}</h3><p class="hint">${esc(c.help || "")}</p>
      <p><code>${esc(c.command)}</code></p>${c.args.map(argInput).join("")}
      <div class="row"><button id="cmd-run" class="primary">Запустить</button>
        <button id="cmd-stop" disabled>Остановить</button><span id="cmd-msg" class="hint"></span></div>
      <div class="log" id="cmd-log"></div>`;
    let running = null;
    $("cmd-run").onclick = async () => {
      const values = {};
      for (const a of c.args) values[a.flag] = readArg(a);
      try {
        const { job_id } = await api(`/api/commands/${c.id}`, { method: "POST", body: { values } });
        running = job_id;
        $("cmd-stop").disabled = false; $("cmd-msg").textContent = "идёт…";
        const job = await watchJob(job_id, (j) => {
          const el = $("cmd-log"); if (el) { el.textContent = jobText(j); el.scrollTop = el.scrollHeight; }

          $("cmd-stop").disabled = true;
        }
        renderCommandJobs();
      } catch (e) { $("cmd-msg").textContent = "ошибка: " + e.message; }
    };
    $("cmd-stop").onclick = async () => {
      if (running) { try { await api(`/api/jobs/${running}/stop`, { method: "POST" }); } catch (e) { alert(e.message); } }

          ${watching ? `<span class="badge running">канал проверяется каждые 10 минут</span>` : ""}</div>
        <div class="row"><button id="h-dl" class="primary">Скачать новые посты</button>
          ${watching ? `<button id="h-unwatch">Перестать следить</button>`
            : `<button id="h-watch" title="Скачивать новые посты каждые 10 минут, пока открыт интерфейс">Следить за каналом</button>`}</div>
        <div class="hint">Первый вход в Telegram спрашивает код из приложения — один раз выполните в терминале
          <code>uv run python -m bot.analyzer.telegram_reader</code>. Дальше кнопки работают сами.</div>
        <div class="log" id="h-dl-log"></div></div>

      <div class="${cls(st.posts > 0 && st.unparsed === 0)}"><h3><span class="stepnum">2</span>Разбор постов в ячейки</h3>
        <div>${st.unparsed ? `Не разобрано: <b>${st.unparsed}</b>.` : st.posts ? "Все посты разобраны." : "Сначала скачайте посты."}
          ${st.failed ? `<span class="warn">Не удалось разобрать: ${st.failed}.</span>` : ""}</div>
        <div class="row"><button id="h-parse" class="primary"${st.unparsed && !parsing ? "" : " disabled"}>Разобрать через Claude API</button>
          <label>постов за раз <input id="h-parse-n" type="number" value="20" min="1" max="500" style="width:5em"></label>
          ${parsing ? `<span class="badge running">идёт разбор</span>` : ""}</div>
        <div class="hint">Платно, нужен <code>ANTHROPIC_API_KEY</code> в <code>.env</code>. Бесплатный вариант — в Claude Code
          попросите «разбери новые посты» (скилл <code>telegram-scenarios</code>). Посты разбираются по порядку:
          новый пост может обновить или отменить ячейку прошлого.</div>
        <div class="log" id="h-parse-log"></div></div>

      <div class="${cls(st.cells_active > 0 && st.cells_review === 0)}"><h3><span class="stepnum">3</span>Ячейки</h3>
        <div>Активных: <b>${st.cells_active}</b>${st.cells_review ? `, из них <span class="warn">ждут проверки уровней с картинки: ${st.cells_review}</span>` : ""}.</div>
        <div class="row"><button id="h-cells">Открыть «Сценарии»</button>
          <button id="h-chart">Ячейки на графике</button></div>
        <div class="hint">Новая ячейка начинает работать через 5 минут после поста и срабатывает один раз.
          До входа она «умирает», если цена дошла до стопа автора или до его первой цели.</div></div>

      <div class="${cls(tgBots.some((b) => b.state === "running"))}"><h3><span class="stepnum">4</span>Paper-бот (виртуальный счёт)</h3>
        <div id="h-bots-table">${tgBots.length ? botTable(tgBots, false) : `<p>Paper-ботов ещё нет.</p>`}</div>
        ${missing.length ? `<div class="row"><button id="h-bots" class="primary">Запустить paper-ботов: ${esc(missing.join(", "))}</button>
          <label>Капитал каждого, USDT <input id="h-capital" type="number" value="10000" min="100" step="100" style="width:8em"></label>
          <span>таймфрейм 1h</span><span id="h-bots-msg" class="hint"></span></div>` : ""}
        <div class="hint">Сделки виртуальные, по живым ценам Bybit, тем же кодом, что бэктест и демо. Боты работают,
          пока открыт этот интерфейс (окно терминала с ним), и сами стартуют при следующем запуске.</div></div>

      <div class="${cls(Boolean(r))}"><h3><span class="stepnum">5</span>Демо-счёт Bybit</h3>
        <div>${r ? `Капитал на демо-счёте: <b>${num(r.equity)}</b> USDT, открыто сделок: ${demo.trades.length}.`
          : "Демо-бот ещё не запускался."}${demo.kill ? ` <span class="loss">ОСТАНОВЛЕН: ${esc(demo.kill)}</span>` : ""}</div>
        <div class="hint">Запуск — в отдельном терминале: <code>uv run python -m bot.runner.live --mode demo</code>
          (монеты и таймфрейм — <code>config/live.yaml</code>, ключи демо-счёта — <code>.env</code>). Ордера уходят на демо-счёт
          и видны на сайте Bybit в Demo Trading. Стоп и тейк стоят на бирже, поэтому открытая сделка защищена,
          даже если компьютер выключен; новые входы без компьютера не происходят. Следить — вкладка «Боты», режим demo.</div></div>
    </div>`;

    $("h-dl").onclick = () => { $("h-dl").disabled = true; runHomeCommand("telegram", {}, "h-dl-log", renderHome); };
    if ($("h-watch")) $("h-watch").onclick = async () => {
      try { await api("/api/commands/telegram", { method: "POST", body: { values: { "--every": 10 } } }); }
      catch (e) { $("h-dl-log").textContent = "ошибка: " + e.message; return; }
      renderHome();
    };
    if ($("h-unwatch")) $("h-unwatch").onclick = async () => {
      try { await api(`/api/jobs/${watching.job_id}/stop`, { method: "POST" }); } catch (e) { alert(e.message); }
      setTimeout(renderHome, 1000);
    };
    $("h-parse").onclick = () => {
      if (!confirm("Разбор через Claude API платный. Разобрать?")) return;
      $("h-parse").disabled = true;
      runHomeCommand("scenarios_parse", { "--limit": Number($("h-parse-n").value) }, "h-parse-log", renderHome);
    };
    $("h-cells").onclick = () => openTab("scenarios");
    $("h-chart").onclick = () => openTab(TG);
    if ($("h-bots")) $("h-bots").onclick = async () => {
      $("h-bots").disabled = true;
      const errors = [];
      for (const symbol of missing) {
        try {
          await api("/api/bots", { method: "POST", body: { strategy: TG, symbol, timeframe: "1h",
            params: {}, capital: Number($("h-capital").value) } });
        } catch (e) { errors.push(`${symbol}: ${e.message}`); }
      }
      renderHome();
      if (errors.length) alert(errors.join("\n"));
    };
    bindBotButtons(box, renderHome);
  }

  // ===================== Сценарии (docs/10) =====================
  const scen = { cancelled: false, posts: [] };

  function triggerText(t) {
    const zone = `${fmt(t.zone_low)}–${fmt(t.zone_high)}`;
    return ({ close_above: `закрытие выше ${fmt(t.level)}`, close_below: `закрытие ниже ${fmt(t.level)}`,
              retest: `ретест ${fmt(t.level)}`, touch_zone: `касание зоны ${zone}`, now: "сразу" })[t.type] || t.type;
  }

  function cellRows(cells) {
    if (!cells.length) return `<p class="hint">Ячеек нет. Они появляются после разбора постов.</p>`;
    const rows = cells.map((c) => {
      const s = c.scenario;
      const targets = s.targets && s.targets.length ? s.targets.map((x) => fmt(x)).join(", ") : "по умолчанию 2R";
      const state = c.status !== "ACTIVE" ? `<span class="hint">отменена</span>`
        : c.needs_review ? `<span class="warn">уровни с картинки</span> <button data-approve="${esc(c.scenario_id)}">Одобрить</button>`
        : `<span class="win">активна</span>`;
      return `<tr title="${esc(s.note_ru || "")}"><td>${esc(c.scenario_id)}</td><td>${esc(c.symbol)}</td>` +
        `<td class="side-${esc(s.side)}">${esc(s.side)}</td><td>${esc(triggerText(s.trigger))}</td>` +
        `<td class="num">${s.stop === null ? "по умолчанию" : fmt(s.stop)}</td><td>${esc(targets)}</td>` +
        `<td>${esc(s.level_source)}</td><td class="num">v${c.version}</td><td>${when(c.updated)}</td><td>${state}</td></tr>`;
    }).join("");
    return `<table><thead><tr><th>Ячейка</th><th>Монета</th><th>Сторона</th><th>Условие</th><th class="num">Стоп</th>` +
      `<th>Цели</th><th>Уровни</th><th class="num">Версия</th><th>Обновлена</th><th>Состояние</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function reportLines(r) {
    if (!r) return "";
    const items = [...r.created.map((x) => `создана ${x}`), ...r.updated.map((x) => `обновлена ${x}`),
      ...r.cancelled.map((x) => `отменена ${x}`), ...r.rejected.map((x) => `<span class="warn">отклонено: ${esc(x)}</span>`)];
    return items.length ? `<div class="hint">${items.map((x) => x.startsWith("<") ? x : esc(x)).join("<br>")}</div>` : "";
  }

  function postCard(p, i) {
    const imgs = p.images.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt=""></a>`).join("");
    const head = p.parsed ? `<span class="badge">${esc(p.kind)}</span> <span class="hint">${esc(p.source)}</span> ${esc(p.summary || "")}`
      : `<span class="hint">не разобран</span>`;
    return `<div class="post"><div class="meta">${when(p.time)} · ${esc(p.channel)} #${p.post_id} ` +
      `<button data-bt="${i}">В бэктест</button></div>` +
      `<div class="text">${esc(p.text)}</div>${imgs ? `<div class="imgs">${imgs}</div>` : ""}` +
      `<div>${head}</div>${reportLines(p.report)}</div>`;
  }

  async function renderScenarios() {
    const box = $("page-scenarios");
    if (!box.dataset.ready) {
      box.dataset.ready = "1";
      box.innerHTML = `
        <p class="hint">Ячейка — один сценарий автора: монета, сторона, условие входа, стоп и цели.
          Бот торгует только активные ячейки. Ячейки с уровнями только с картинки он не торгует,
          пока вы не сверите уровни с картинкой и не нажмёте «Одобрить». Новые посты скачиваются
          и разбираются на вкладке «Старт».</p>
        <h3>Ячейки <label class="hint"><input type="checkbox" id="sc-cancelled"> показать отменённые</label></h3>
        <div id="sc-cells"></div>
        <h3>Бэктест поста</h3>
        <div class="card">
          <div class="row"><label>Дата публикации (UTC) <input id="sc-date" placeholder="2025-03-01 10:00" style="width:11em"></label>
            <label>Дней <input id="sc-days" type="number" value="30" min="1" max="365" style="width:5em"></label>
            <label>Таймфрейм <select id="sc-tf">${["15m", "1h", "4h"].map((t) => `<option${t === "1h" ? " selected" : ""}>${t}</option>`).join("")}</select></label>
            <label title="Торговать ячейки, уровни которых взяты только с картинки"><input type="checkbox" id="sc-img"> уровни с картинки</label></div>
          <div>Текст поста<textarea id="sc-text" rows="5"></textarea></div>
          <div>Ответ разбора (JSON по схеме). Пусто — разбор через Claude API, платно.<textarea id="sc-answer" rows="5"></textarea></div>
          <div class="row"><button class="primary" id="sc-run">Запустить</button><span class="hint" id="sc-post"></span></div>
          <div class="log" id="sc-log"></div>
        </div>
        <h3>Посты канала</h3>
        <div id="sc-posts"><p class="hint">Загрузка…</p></div>`;
      $("sc-cancelled").onchange = (e) => { scen.cancelled = e.target.checked; renderScenarios(); };
      $("sc-run").onclick = runPostBacktest;
    }
    let data;
    try { data = await api(`/api/scenarios?cancelled=${scen.cancelled}`); }
    catch (e) { $("sc-cells").innerHTML = `<p class="loss">${esc(e.message)}</p>`; return; }
    $("sc-cells").innerHTML = cellRows(data.cells);
    $("sc-cells").querySelectorAll("button[data-approve]").forEach((b) => b.onclick = async () => {
      if (!confirm(`Уровни ячейки ${b.dataset.approve} сверены с картинкой? После одобрения бот сможет по ней торговать.`)) return;
      try { await api(`/api/scenarios/${encodeURIComponent(b.dataset.approve)}/approve`, { method: "POST" }); }
      catch (e) { alert(e.message); }
      renderScenarios();
    });
    scen.posts = data.posts;
    $("sc-posts").innerHTML = data.posts.length ? data.posts.map(postCard).join("")
      : `<p class="hint">Постов нет. Выгрузите канал: «Команды» → «Скачать посты канала».</p>`;
    $("sc-posts").querySelectorAll("button[data-bt]").forEach((b) => b.onclick = () => {
      const p = scen.posts[Number(b.dataset.bt)];
      $("sc-text").value = p.text;
      $("sc-date").value = isoTime(p.published_at).slice(0, 16);
      $("sc-answer").value = p.result ? JSON.stringify(p.result, null, 1) : "";
      $("sc-post").textContent = `пост #${p.post_id}` + (p.result ? ", ответ разбора подставлен" : ", не разобран: картинки поста уйдут в Claude API");
      $("sc-post").dataset.id = p.post_id;
      $("sc-text").scrollIntoView({ behavior: "smooth", block: "center" });
    });
  }

  async function runPostBacktest() {
    const postId = $("sc-post").dataset.id;
    const body = { text: $("sc-text").value, date: $("sc-date").value.trim(), answer_json: $("sc-answer").value,
                   days: Number($("sc-days").value), timeframe: $("sc-tf").value,
                   allow_image_levels: $("sc-img").checked, post_id: postId ? Number(postId) : null };
    $("sc-run").disabled = true;
    try {
      const { job_id } = await api("/api/scenarios/backtest", { method: "POST", body });
      const job = await watchJob(job_id, (j) => $("sc-log").textContent = jobText(j));
      if (job.status === "done") await refreshBacktests();
    } catch (e) { $("sc-log").textContent = e.message; }
    finally { $("sc-run").disabled = false; }
  }
  // Текст поста изменили руками — это уже не пост из ленты, его картинки не берём
  document.addEventListener("input", (e) => {
    if (e.target && e.target.id === "sc-text" && $("sc-post").dataset.id) {
      delete $("sc-post").dataset.id;
      $("sc-post").textContent = "";
    }
  });

  // ===================== запуск =====================
  async function loadMeta() {
    const meta = await api("/api/strategies");
    app.symbols = meta.symbols;
    app.timeframes = meta.timeframes;
    app.strategies = meta.strategies;
    $("w-tf").innerHTML = app.timeframes.map((t) => `<option>${t}</option>`).join("");
  }

  setInterval(async () => {
    if (app.tab === "home" && $("h-bots-table")) {
      await refreshBots();
      const list = app.bots.filter((b) => b.strategy === TG);
      if (list.length) { $("h-bots-table").innerHTML = botTable(list, false); bindBotButtons($("h-bots-table"), renderHome); }
    }
    else if (app.tab === "bots") { await refreshBots(); const t = $("bp-table"); if (t) { t.innerHTML = botTable(app.bots, true); bindBotButtons(t, renderBotsPage); } loadCliBot(); }
    else if (app.views[app.tab] && app.views[app.tab].sub === "bots") { await refreshBots(); renderStrategyBots(app.views[app.tab]); }
  }, 10000);

  (async () => {
    await loadMeta();
    await Promise.all([refreshBacktests(), refreshBots()]);
    let start = "home";
    try { start = localStorage.getItem("bot.tab") || "home"; } catch (e) { /* нет localStorage */ }
    const known = ["home", "bots", "data", "journals", "commands", "scenarios", TG];
    openTab(known.includes(start) ? start : "home");
  })();
  </script>
</body>
</html>
