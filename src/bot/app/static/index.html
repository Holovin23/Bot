<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bot — график</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #ffffff; --fg: #1f2328; --muted: #6e7781; --border: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --border: #30363d; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; gap: 12px; align-items: center; padding: 8px 16px;
      border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    select { font: inherit; padding: 2px 6px; }
    .legend { display: flex; gap: 12px; color: var(--muted); }
    .legend span::before { content: ""; display: inline-block; width: 12px; height: 3px;
      margin-right: 4px; vertical-align: middle; background: var(--c); }
    #status { color: var(--muted); margin-left: auto; }
    #chart { flex: 1; min-height: 300px; }
    #panel { height: 34vh; min-height: 180px; display: flex; flex-direction: column;
      border-top: 1px solid var(--border); }
    .tabs { display: flex; gap: 4px; padding: 4px 16px 0; }
    .tabs button { font: inherit; background: none; color: var(--muted); border: 1px solid
      transparent; border-bottom: none; padding: 4px 10px; cursor: pointer; }
    .tabs button.active { color: var(--fg); border-color: var(--border);
      border-radius: 6px 6px 0 0; }
    .tab { flex: 1; overflow: auto; padding: 4px 16px; display: none; }
    .tab.active { display: block; }
    #tab-equity.active { display: flex; }
    #equity { flex: 1; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: right; padding: 2px 8px; border-bottom: 1px solid var(--border);
      white-space: nowrap; }
    th { position: sticky; top: 0; background: var(--bg); color: var(--muted); }
    th:nth-child(2), td:nth-child(2), th:nth-child(7), td:nth-child(7) { text-align: left; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
    tbody tr.selected { background: color-mix(in srgb, #4a90e2 18%, transparent); }
    .win { color: #1a7f37; } .loss { color: #cf222e; }
    #report { white-space: pre-wrap; font: 13px ui-monospace, monospace; margin: 0; }
    .hint { color: var(--muted); }
    .post { border-bottom: 1px solid var(--border); padding: 6px 0; }
    .post .meta { color: var(--muted); font-size: 12px; }
    .post .text { white-space: pre-wrap; margin: 4px 0; }
    .bias { font-weight: 600; margin-right: 8px; }
    .bias.BULLISH { color: #1a7f37; } .bias.BEARISH { color: #cf222e; }
    .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 6px 0; }
    .row input { font: inherit; width: 9em; }
    .row input[type=date] { width: auto; }
    #tradeinfo { padding: 4px 16px; color: var(--muted); min-height: 1.4em; }
    #tradeinfo b { color: var(--fg); font-weight: 600; }
    footer { padding: 4px 16px; color: var(--muted); font-size: 12px;
      border-top: 1px solid var(--border); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <header>
    <label>Символ <select id="symbol"></select></label>
    <label>Таймфрейм <select id="timeframe"></select></label>
    <label>Бэктест <select id="backtest"><option value="">—</option></select></label>
    <label>Сделка <select id="trade" disabled></select></label>
    <div class="legend">
      <span style="--c:#f5a623">EMA20</span>
      <span style="--c:#4a90e2">EMA50</span>
      <span style="--c:#bd10e0">EMA200</span>
      <span style="--c:#8b949e">Bollinger (20, 2)</span>
    </div>
    <div id="status"></div>
  </header>
  <div id="tradeinfo"></div>
  <div id="chart"></div>
  <div id="panel">
    <div class="tabs">
      <button data-tab="trades" class="active">Сделки</button>
      <button data-tab="equity">Капитал</button>
      <button data-tab="report">Отчёт</button>
      <button data-tab="run">Запуск</button>
      <button data-tab="telegram">Telegram</button>
    </div>
    <div id="tab-trades" class="tab active"><p class="hint">Выберите бэктест.</p></div>
    <div id="tab-equity" class="tab"><div id="equity"></div></div>
    <div id="tab-report" class="tab"><pre id="report" class="hint">Выберите бэктест.</pre></div>
    <div id="tab-telegram" class="tab"><p class="hint">Загрузка…</p></div>
    <div id="tab-run" class="tab">
      <form id="runform">
        <div class="row">
          <label>Стратегия <select id="r-strategy"></select></label>
          <label>Символ <select id="r-symbol"></select></label>
          <label>Таймфрейм <select id="r-timeframe"></select></label>
          <label>С <input id="r-start" type="date" value="2021-01-01"></label>
          <label>по <input id="r-end" type="date" value="2024-06-30"></label>
          <button type="submit">Запустить</button>
          <span id="r-status" class="hint"></span>
        </div>
        <div id="r-params" class="row"></div>
        <p class="hint">Бэктест на in-sample. Validation и hold-out проверяются командой
          <code>bot.research.validate</code>, а не отсюда.</p>
      </form>
    </div>
  </div>
  <footer>
    Время — локальное. Графики:
    <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>
    Lightweight Charts™ (Apache 2.0).
  </footer>

  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script>
    const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const chart = LightweightCharts.createChart(document.getElementById("chart"), {
      autoSize: true,
      layout: { background: { color: dark ? "#0d1117" : "#ffffff" },
                textColor: dark ? "#e6edf3" : "#1f2328", attributionLogo: true },
      grid: { vertLines: { color: dark ? "#21262d" : "#eef1f4" },
              horzLines: { color: dark ? "#21262d" : "#eef1f4" } },
      timeScale: { timeVisible: true, secondsVisible: false },
    });
    const candles = chart.addCandlestickSeries();
    const line = (color, width = 2) => chart.addLineSeries({
      color, lineWidth: width, priceLineVisible: false, lastValueVisible: false,
    });
    const lines = {
      ema20: line("#f5a623"), ema50: line("#4a90e2"), ema200: line("#bd10e0"),
      bb_upper: line("#8b949e", 1), bb_middle: line("#8b949e", 1), bb_lower: line("#8b949e", 1),
    };

    // Сервер отдаёт время в UTC; сдвигаем на часовой пояс компьютера.
    const local = (t) => t - new Date(t * 1000).getTimezoneOffset() * 60;
    const status = document.getElementById("status");
    const symbolSel = document.getElementById("symbol");
    const tfSel = document.getElementById("timeframe");

    const backtestSel = document.getElementById("backtest");
    const tradeSel = document.getElementById("trade");
    const info = document.getElementById("tradeinfo");
    let backtest = null;      // выбранный бэктест со сделками
    let priceLines = [];      // линии входа, стопа и тейка выбранной сделки
    const TF_SECONDS = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "4h": 14400 };
    const BARS_AFTER_EXIT = 60;  // сколько свечей показать после выхода

    const fmt = (v) => v === null ? "—" : Number(v).toLocaleString(undefined,
                                                                   { maximumFractionDigits: 4 });
    const when = (t) => new Date(t * 1000).toLocaleString();

    async function load(until = null) {
      status.textContent = "загрузка…";
      const params = new URLSearchParams({ symbol: symbolSel.value, timeframe: tfSel.value,
                                           limit: 1000 });
      if (until !== null) params.set("until", until);
      const response = await fetch("/api/candles?" + params);
      if (!response.ok) { status.textContent = "ошибка " + response.status; return; }
      const data = await response.json();
      const rows = data.candles;
      candles.setData(rows.map((r) => ({ time: local(r.time), open: r.open, high: r.high,
                                         low: r.low, close: r.close })));
      for (const [name, series] of Object.entries(lines)) {
        series.setData(rows.filter((r) => r[name] !== null)
                           .map((r) => ({ time: local(r.time), value: r[name] })));
      }
      drawTrades(rows);
      if (until === null) chart.timeScale().fitContent();
      status.textContent = rows.length
        ? `${rows.length} свечей, последняя ${when(rows.at(-1).time)}`
        : "нет данных — сначала загрузите историю";
    }

    // Маркеры входов и выходов всех сделок бэктеста, попавших на загруженные свечи.
    function drawTrades(rows) {
      priceLines.forEach((l) => candles.removePriceLine(l));
      priceLines = [];
      const same = backtest && backtest.symbol === symbolSel.value;
      if (!same || !rows.length) { candles.setMarkers([]); return; }
      const step = TF_SECONDS[tfSel.value];
      const first = rows[0].time, last = rows.at(-1).time + step;
      const bar = (t) => local(Math.floor(t / step) * step);
      const markers = [];
      for (const t of backtest.trades) {
        const long = t.side === "LONG";
        const chosen = String(t.number) === tradeSel.value;
        if (t.entry_time >= first && t.entry_time < last) {
          markers.push({ time: bar(t.entry_time), position: long ? "belowBar" : "aboveBar",
                         shape: long ? "arrowUp" : "arrowDown",
                         color: long ? "#1a7f37" : "#cf222e",
                         text: chosen ? `#${t.number} вход` : `#${t.number}` });
        }
        if (t.exit_time !== null && t.exit_time >= first && t.exit_time < last) {
          markers.push({ time: bar(t.exit_time), position: long ? "aboveBar" : "belowBar",
                         shape: "circle", color: t.r_multiple >= 0 ? "#1a7f37" : "#cf222e",
                         text: `${t.exit_reason} ${t.r_multiple.toFixed(2)}R` });
        }
      }
      markers.sort((a, b) => a.time - b.time);
      candles.setMarkers(markers);

      const t = selectedTrade();
      if (!t) return;
      const add = (price, color, title, style = 2) => {
        if (price !== null) {
          priceLines.push(candles.createPriceLine({ price, color, title, lineWidth: 1,
                                                    lineStyle: style, axisLabelVisible: true }));
        }
      };
      add(t.entry_price, "#4a90e2", "вход", 0);
      add(t.initial_stop, "#cf222e", "стоп");
      if (t.stop !== t.initial_stop) add(t.stop, "#fb8f44", "стоп (трейлинг)");
      add(t.take, "#1a7f37", "тейк");
    }

    // Вкладки под графиком
    const tabs = document.querySelectorAll(".tabs button");
    tabs.forEach((b) => b.onclick = () => {
      tabs.forEach((x) => x.classList.toggle("active", x === b));
      document.querySelectorAll(".tab").forEach((t) =>
        t.classList.toggle("active", t.id === "tab-" + b.dataset.tab));
      if (b.dataset.tab === "equity") requestAnimationFrame(() => equityChart.timeScale().fitContent());
      if (b.dataset.tab === "telegram") loadTelegram();
    });

    const equityChart = LightweightCharts.createChart(document.getElementById("equity"), {
      autoSize: true,
      layout: { background: { color: dark ? "#0d1117" : "#ffffff" },
                textColor: dark ? "#e6edf3" : "#1f2328", attributionLogo: true },
      grid: { vertLines: { visible: false }, horzLines: { color: dark ? "#21262d" : "#eef1f4" } },
      timeScale: { timeVisible: true, secondsVisible: false },
    });
    const equityLine = equityChart.addLineSeries({ color: "#4a90e2", lineWidth: 2 });

    function renderTable() {
      const box = document.getElementById("tab-trades");
      if (!backtest || !backtest.trades.length) {
        box.innerHTML = `<p class="hint">${backtest ? "В бэктесте нет сделок." : "Выберите бэктест."}</p>`;
        return;
      }
      const rows = backtest.trades.map((t) => {
        const cls = t.r_multiple >= 0 ? "win" : "loss";
        return `<tr data-n="${t.number}"><td>${t.number}</td><td>${t.side}</td>` +
          `<td>${when(t.entry_time)}</td><td>${fmt(t.entry_price)}</td>` +
          `<td>${t.exit_time === null ? "—" : when(t.exit_time)}</td><td>${fmt(t.exit_price)}</td>` +
          `<td>${t.exit_reason}</td><td class="${cls}">${t.r_multiple.toFixed(2)}</td>` +
          `<td class="${cls}">${fmt(t.net_pnl)}</td></tr>`;
      }).join("");
      box.innerHTML = `<table><thead><tr><th>#</th><th>Сторона</th><th>Вход</th><th>Цена</th>` +
        `<th>Выход</th><th>Цена</th><th>Причина</th><th>R</th><th>USDT</th></tr></thead>` +
        `<tbody>${rows}</tbody></table>`;
      box.querySelectorAll("tbody tr").forEach((tr) => tr.onclick = () => {
        tradeSel.value = tr.dataset.n;
        showTrade();
      });
      markRow();
    }

    function markRow() {
      document.querySelectorAll("#tab-trades tbody tr").forEach((tr) =>
        tr.classList.toggle("selected", tr.dataset.n === tradeSel.value));
    }

    async function loadExtras(id) {
      const [eq, rep] = await Promise.all([
        fetch(`/api/backtests/${encodeURIComponent(id)}/equity`).then((r) => r.json()),
        fetch(`/api/backtests/${encodeURIComponent(id)}/report`).then((r) => r.json()),
      ]);
      equityLine.setData(eq.equity.map((p) => ({ time: local(p.time), value: p.value })));
      equityChart.timeScale().fitContent();
      const report = document.getElementById("report");
      report.textContent = rep.report || "Отчёта нет.";
      report.classList.toggle("hint", !rep.report);
    }

    function selectedTrade() {
      if (!backtest) return null;
      return backtest.trades.find((t) => String(t.number) === tradeSel.value) || null;
    }

    function showTrade() {
      markRow();
      const t = selectedTrade();
      if (!t) { info.textContent = ""; load(); return; }
      info.innerHTML = `<b>#${t.number} ${t.side}</b> вход ${when(t.entry_time)} по ` +
        `${fmt(t.entry_price)}, стоп ${fmt(t.initial_stop)}, тейк ${fmt(t.take)}; ` +
        `выход ${t.exit_time === null ? "—" : when(t.exit_time)} по ${fmt(t.exit_price)} ` +
        `(${t.exit_reason}), <b>${t.r_multiple.toFixed(2)}R, ${fmt(t.net_pnl)} USDT</b>`;
      const step = TF_SECONDS[tfSel.value];
      load((t.exit_time ?? t.entry_time) + BARS_AFTER_EXIT * step).then(() => {
        const from = local(t.entry_time) - 60 * step;
        const to = local(t.exit_time ?? t.entry_time) + BARS_AFTER_EXIT * step;
        chart.timeScale().setVisibleRange({ from, to });
      });
    }

    async function chooseBacktest() {
      backtest = null;
      tradeSel.innerHTML = "";
      tradeSel.disabled = true;
      info.textContent = "";
      if (!backtestSel.value) {
        renderTable();
        equityLine.setData([]);
        document.getElementById("report").textContent = "Выберите бэктест.";
        load();
        return;
      }
      const response = await fetch("/api/backtests/" + encodeURIComponent(backtestSel.value));
      if (!response.ok) { status.textContent = "ошибка " + response.status; return; }
      backtest = await response.json();
      symbolSel.value = backtest.symbol;
      if (TF_SECONDS[backtest.timeframe]) tfSel.value = backtest.timeframe;
      tradeSel.innerHTML = backtest.trades.map((t) =>
        `<option value="${t.number}">#${t.number} ${new Date(t.entry_time * 1000)
          .toLocaleDateString()} ${t.side} ${t.exit_reason} ${t.r_multiple.toFixed(2)}R</option>`
      ).join("");
      tradeSel.disabled = backtest.trades.length === 0;
      renderTable();
      loadExtras(backtest.id);
      if (backtest.trades.length) showTrade();
      else { info.textContent = "в бэктесте нет сделок"; load(); }
    }

    // Лента Telegram с разбором ИИ (только справочно, на сделки не влияет)
    const escapeHtml = (t) => t.replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    async function loadTelegram() {
      const box = document.getElementById("tab-telegram");
      const posts = (await (await fetch("/api/telegram")).json()).posts;
      if (!posts.length) {
        box.innerHTML = `<p class="hint">Постов нет. Выгрузите канал: ` +
          `<code>uv run python -m bot.analyzer.telegram_reader --channel …</code></p>`;
        return;
      }
      box.innerHTML = posts.map((p) => {
        const views = p.views.map((v) =>
          `<span class="bias ${v.bias}">${v.symbol} ${v.bias} (${v.horizon})</span>`).join("");
        const summary = p.summary === null ? `<span class="hint">не разобран</span>`
          : `${views}${escapeHtml(p.summary)}`;
        return `<div class="post"><div class="meta">${when(p.time)} · ${escapeHtml(p.channel)}` +
          ` #${p.post_id}</div><div class="text">${escapeHtml(p.text)}</div>` +
          `<div>ИИ: ${summary}</div></div>`;
      }).join("");
    }

    // Запуск бэктеста из интерфейса
    let catalog = [];
    const rStrategy = document.getElementById("r-strategy");
    const rStatus = document.getElementById("r-status");

    function renderParams() {
      const strategy = catalog.find((c) => c.name === rStrategy.value);
      document.getElementById("r-params").innerHTML = Object.entries(strategy.params).map(
        ([k, v]) => `<label>${k} <input name="${k}" value="${v}"></label>`).join("");
    }

    function parseValue(text) {
      if (text === "true" || text === "false") return text === "true";
      if (text === "null" || text === "") return null;
      const n = Number(text);
      return Number.isNaN(n) ? text : n;
    }

    async function refreshBacktests(selectId = null) {
      const list = (await (await fetch("/api/backtests")).json()).backtests;
      backtestSel.innerHTML = `<option value="">—</option>` + list.map((b) =>
        `<option value="${b.id}">${b.created} ${b.strategy} ${b.symbol} ${b.timeframe}</option>`
      ).join("");
      if (selectId) { backtestSel.value = selectId; chooseBacktest(); }
    }

    document.getElementById("runform").onsubmit = async (event) => {
      event.preventDefault();
      const params = {};
      document.querySelectorAll("#r-params input").forEach((i) => params[i.name] = parseValue(i.value));
      const body = { strategy: rStrategy.value, symbol: document.getElementById("r-symbol").value,
                     timeframe: document.getElementById("r-timeframe").value,
                     start: document.getElementById("r-start").value,
                     end: document.getElementById("r-end").value, params };
      const response = await fetch("/api/backtests/run", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await response.json();
      if (!response.ok) { rStatus.textContent = "ошибка: " + data.detail; return; }
      rStatus.textContent = "идёт бэктест…";
      const started = Date.now();
      const timer = setInterval(async () => {
        const job = await (await fetch("/api/jobs/" + data.job_id)).json();
        if (job.status === "running") {
          rStatus.textContent = `идёт бэктест… ${Math.round((Date.now() - started) / 1000)} с`;
          return;
        }
        clearInterval(timer);
        if (job.status === "error") { rStatus.textContent = "ошибка: " + job.error; return; }
        rStatus.textContent = "готово";
        await refreshBacktests(job.backtest_id);
      }, 1000);
    };

    (async () => {
      const meta = await (await fetch("/api/symbols")).json();
      symbolSel.innerHTML = meta.symbols.map((s) => `<option>${s}</option>`).join("");
      tfSel.innerHTML = meta.timeframes.map((t) => `<option>${t}</option>`).join("");
      tfSel.value = "1h";
      await refreshBacktests();
      const strategies = await (await fetch("/api/strategies")).json();
      catalog = strategies.strategies.filter((c) => c.name !== "random_entry")
        .concat(strategies.strategies.filter((c) => c.name === "random_entry"));
      rStrategy.innerHTML = catalog.map((c) => `<option>${c.name}</option>`).join("");
      document.getElementById("r-symbol").innerHTML =
        strategies.symbols.map((x) => `<option>${x}</option>`).join("");
      document.getElementById("r-timeframe").innerHTML = strategies.timeframes
        .map((x) => `<option${x === "1h" ? " selected" : ""}>${x}</option>`).join("");
      rStrategy.onchange = renderParams;
      renderParams();
      symbolSel.onchange = tfSel.onchange = () => (selectedTrade() ? showTrade() : load());
      backtestSel.onchange = chooseBacktest;
      tradeSel.onchange = showTrade;
      load();
    })();
  </script>
</body>
</html>
