# Общие настройки бота. Секреты здесь НЕ хранятся — только в .env.

data:
  dir: data
  symbols: [BTCUSDT, ETHUSDT]
  category: linear
  history_start: "2021-01-01"
  base_interval: 1m
  timeframes: [5m, 15m, 1h, 4h]
  open_interest_interval: 5min

logging:
  dir: logs
  level: INFO
  retention_days: 30

app:
  host: 127.0.0.1
  port: 8000

# Издержки для бэктеста (сверить с таблицей Bybit в начале этапа 2)
costs:
  taker_fee: 0.00055
  maker_fee: 0.0002
  slippage:
    BTCUSDT: 0.0003
    ETHUSDT: 0.0005
  stop_slippage_multiplier: 2.0
  initial_capital: 10000

# Параметры инструментов для расчёта объёма (сверить с выводом scripts/check_connection.py)
instruments:
  BTCUSDT: {tick_size: 0.1, qty_step: 0.001, min_qty: 0.001}
  ETHUSDT: {tick_size: 0.01, qty_step: 0.01, min_qty: 0.01}

# Риск-менеджер (docs/05-risk-and-execution.md). Ослаблять только решением владельца.
risk:
  risk_per_trade: 0.005
  max_leverage: 3.0

# Проверки перед каждой сделкой (docs/05-risk-and-execution.md). Ослаблять только решением
# владельца: код не примет значения мягче, чем в 05.
limits:
  max_positions: 2
  max_positions_per_symbol: 1
  max_total_risk: 0.015
  correlated_groups: [[BTCUSDT, ETHUSDT]]
  correlated_weight: 1.5
  daily_loss: 0.02
  max_drawdown: 0.10
  max_loss_streak: 6
  min_stop_atr: 0.5
  max_stop_atr: 4.0
  liq_buffer: 2.0
  max_cost_share: 0.2
  stale_bars: 2
  default_min_rr: 1.5
  min_rr: {random_entry: 1.0, telegram_scenario: 2.0}

# Сценарии из Telegram-канала (docs/10-telegram-scenarios-plan.md).
# symbols — белый список: сценарии по другим монетам отклоняются. Чтобы торговать
# монетой, она должна быть и в instruments (или добавлена из веб-интерфейса).
scenarios:
  channel: Prizrak_trade
  symbols: [BTCUSDT, ETHUSDT]
  model: claude-opus-5-5   # для плана А (Claude API); claude-sonnet-5-5 дешевле вдвое

# Этап 8: профиль риска реального счёта (используется только в режиме live, который
# выключен по умолчанию). Код не примет значения мягче указанных здесь границ.
live_risk:
  risk_per_trade: 0.0025
  max_leverage: 3.0
  max_positions: 1
  max_total_risk: 0.005
  daily_loss: 0.01
  max_drawdown: 0.05
