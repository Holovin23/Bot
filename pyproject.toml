[project]
name = "bot"
version = "0.1.0"
description = "Торговый бот для Bybit Demo Trading"
readme = "docs/README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pybit>=5.17.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# Комментарии и документация на русском: кириллица — не ошибка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["pybit.*"]
ignore_missing_imports = true
